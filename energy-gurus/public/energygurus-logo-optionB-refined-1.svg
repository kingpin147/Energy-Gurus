<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Space Grotesk', sans-serif">
  <defs>
    <style>
      .word { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- REFINED MARK: a segmented seal ring (like a stamp of approval, broken into arcs rather than
       solid — reads as "certified" without becoming a cliché award-ribbon). Inside, two cells
       interlock at a shared corner: a solar panel cell (outlined, gridded) and a battery cell
       (solid amber, with terminal). Where they overlap, a checkmark notch is cut from the amber
       cell — so "verified" is built structurally into the overlap, not bolted on as a separate icon. -->

  <!-- ============ VERSION 1: Primary lockup, on light ============ -->
  <g transform="translate(20,20)">
    <!-- segmented seal ring -->
    <g fill="none" stroke="#12213A" stroke-width="3" stroke-linecap="round">
      <path d="M60,8 A52,52 0 0,1 108,44"/>
      <path d="M112,58 A52,52 0 0,1 100,98"/>
      <path d="M88,108 A52,52 0 0,1 46,111"/>
      <path d="M20,96 A52,52 0 0,1 10,56"/>
      <path d="M16,42 A52,52 0 0,1 44,12"/>
    </g>

    <!-- solar cell: outlined square, gridded -->
    <rect x="30" y="34" width="42" height="42" rx="5" fill="#F5F6F3" stroke="#12213A" stroke-width="3"/>
    <line x1="30" y1="55" x2="72" y2="55" stroke="#12213A" stroke-width="1.6" opacity="0.45"/>
    <line x1="51" y1="34" x2="51" y2="76" stroke="#12213A" stroke-width="1.6" opacity="0.45"/>

    <!-- battery cell: solid amber square, overlapping bottom-right, with terminal -->
    <rect x="56" y="58" width="36" height="36" rx="5" fill="#E8A33D"/>
    <rect x="66" y="52" width="16" height="8" rx="2" fill="#E8A33D"/>

    <!-- checkmark cut from the overlap, in paper color so it reads as a notch -->
    <path d="M62,74 L70,82 L84,64" fill="none" stroke="#F5F6F3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="150" y="52" class="word" font-size="42" fill="#12213A">EnergyGurus<tspan fill="#E8A33D">.Online</tspan></text>
    <text x="152" y="80" class="mono" font-size="14" letter-spacing="2" fill="#4A5A73">AUTHENTICITY GUARANTEED</text>
  </g>

  <!-- ============ VERSION 2: On dark ============ -->
  <g transform="translate(20,170)">
    <rect x="-4" y="-4" width="700" height="120" fill="#12213A" rx="6"/>
    <g fill="none" stroke="#F5F6F3" stroke-width="3" stroke-linecap="round">
      <path d="M60,8 A52,52 0 0,1 108,44"/>
      <path d="M112,58 A52,52 0 0,1 100,98"/>
      <path d="M88,108 A52,52 0 0,1 46,111"/>
      <path d="M20,96 A52,52 0 0,1 10,56"/>
      <path d="M16,42 A52,52 0 0,1 44,12"/>
    </g>
    <rect x="30" y="34" width="42" height="42" rx="5" fill="#12213A" stroke="#F5F6F3" stroke-width="3"/>
    <line x1="30" y1="55" x2="72" y2="55" stroke="#F5F6F3" stroke-width="1.6" opacity="0.4"/>
    <line x1="51" y1="34" x2="51" y2="76" stroke="#F5F6F3" stroke-width="1.6" opacity="0.4"/>
    <rect x="56" y="58" width="36" height="36" rx="5" fill="#E8A33D"/>
    <rect x="66" y="52" width="16" height="8" rx="2" fill="#E8A33D"/>
    <path d="M62,74 L70,82 L84,64" fill="none" stroke="#12213A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="52" class="word" font-size="42" fill="#F5F6F3">EnergyGurus<tspan fill="#E8A33D">.Online</tspan></text>
    <text x="152" y="80" class="mono" font-size="14" letter-spacing="2" fill="rgba(245,246,243,0.55)">AUTHENTICITY GUARANTEED</text>
  </g>

  <!-- ============ VERSION 3: Icon-only (favicon / app icon) ============ -->
  <g transform="translate(20,330)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#12213A"/>
    <g transform="translate(4,4) scale(0.8)">
      <g fill="none" stroke="#F5F6F3" stroke-width="3.5" stroke-linecap="round">
        <path d="M60,8 A52,52 0 0,1 108,44"/>
        <path d="M112,58 A52,52 0 0,1 100,98"/>
        <path d="M88,108 A52,52 0 0,1 46,111"/>
        <path d="M20,96 A52,52 0 0,1 10,56"/>
        <path d="M16,42 A52,52 0 0,1 44,12"/>
      </g>
      <rect x="30" y="34" width="42" height="42" rx="5" fill="#12213A" stroke="#F5F6F3" stroke-width="3.5"/>
      <rect x="56" y="58" width="36" height="36" rx="5" fill="#E8A33D"/>
      <rect x="66" y="52" width="16" height="8" rx="2" fill="#E8A33D"/>
      <path d="M62,74 L70,82 L84,64" fill="none" stroke="#12213A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ============ VERSION 4: Wordmark + tagline, single color ============ -->
  <g transform="translate(160,375)">
    <text x="0" y="0" class="word" font-size="36" fill="#12213A">EnergyGurus.Online</text>
    <text x="2" y="24" class="mono" font-size="13" letter-spacing="2" fill="#4A5A73">AUTHENTICITY GUARANTEED</text>
  </g>
</svg>
